# what gets retried, the shape of the data.
#
#   - id: charges-idempotent-for-24h
#     status: supported
#     claim: Payments treats a repeated Idempotency-Key as the same charge for
#       24 hours. Beyond that it is a new charge.
#     reason: The contract guarantees it for that window, and a run inside the
#       window agreed. The 24-hour boundary itself is untested.
#     verification: Read the provider's API reference for POST /charges, then
#       sent the same key twice 10 minutes apart and got the first charge id
